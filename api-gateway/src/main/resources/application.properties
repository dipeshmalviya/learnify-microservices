spring.application.name=api-gateway
server.port=${PORT:8080}

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:lb://USER-SERVICE}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=category-service
spring.cloud.gateway.routes[1].uri=${CATEGORY_SERVICE_URL:lb://CATEGORY-SERVICE}
spring.cloud.gateway.routes[1].predicates[0]=Path=/categories/**

spring.cloud.gateway.routes[2].id=purchase-service
spring.cloud.gateway.routes[2].uri=${PURCHASE_SERVICE_URL:lb://PURCHASE-SERVICE}
spring.cloud.gateway.routes[2].predicates[0]=Path=/purchases/**
